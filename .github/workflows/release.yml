# Quando pubblichi una Release (tag "vX.Y.Z") dal sito di GitHub, compila l'APK firmato
# e lo allega alla Release. Le auto lo trovano al controllo aggiornamenti successivo.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da pubblicare (es. v1.0.1)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK (API 28 + build-tools)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-28" "build-tools;34.0.0" > /dev/null

      - name: Pillow (icona)
        run: pip install --quiet pillow

      - name: Chiave di firma
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::Manca il secret KEYSTORE_B64: build saltata (vedi README, sezione Rilasci)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > release.keystore
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Compila APK
        if: steps.key.outputs.ok == 'true'
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          export ANDROID_JAR="$ANDROID_HOME/platforms/android-28/android.jar"
          export D8="$ANDROID_HOME/build-tools/34.0.0/d8"
          export KEYSTORE=release.keystore
          export KEYSTORE_PASS="${KEYSTORE_PASS:-taskmanager}"
          export VERSION_NAME="$TAG"
          sh build.sh

      - name: Pubblica Release
        if: steps.key.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=RELEASE_NOTES.md
          [ -f "$NOTES" ] || { echo "Aggiornamento $TAG" > /tmp/notes.md; NOTES=/tmp/notes.md; }
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" MG4-TaskManager.apk --clobber
          else
            gh release create "$TAG" MG4-TaskManager.apk --title "MG4 Task Manager $TAG" --notes-file "$NOTES" --target "$GITHUB_SHA"
          fi
